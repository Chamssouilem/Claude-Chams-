# Netlify-Konfiguration für pattiesandberries.de
# Next.js wird als statischer Export gebaut (siehe next.config.mjs) — Netlify
# liefert den Ordner "out" direkt als statische Seite aus.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Sicherheits- und Datenschutz-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# Selbstgehostete Schriften: ein Jahr Cache, unveränderlich
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Alte eatbu-Pfade und gängige Tippfehler auf die neuen Sektionen umlenken
[[redirects]]
  from = "/speisekarte"
  to = "/#speisekarte"
  status = 301

[[redirects]]
  from = "/menu"
  to = "/#speisekarte"
  status = 301

[[redirects]]
  from = "/bestellen"
  to = "/#bestellen"
  status = 301

[[redirects]]
  from = "/kontakt"
  to = "/#finden"
  status = 301
